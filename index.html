<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewIQ AI — Aspect-Based Sentiment Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          }
        }
      }
    }
  </script>

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Liquid Glass Styles */
    .glass-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }
    .dark .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.6);
    }
    .dark .glass-nav {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(30, 41, 59, 0.6);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isDark, setIsDark] = useState(true);
      const [products, setProducts] = useState([]);
      const [metrics, setMetrics] = useState(null);
      const [loading, setLoading] = useState(true);
      const [reviewInput, setReviewInput] = useState("The camera is fantastic and the display looks beautiful, but the battery drains quickly and the price is too high.");
      const [analysisResult, setAnalysisResult] = useState(null);
      const [analyzing, setAnalyzing] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');

      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDark]);

      useEffect(() => {
        fetchData();
      }, []);

      const fetchData = async () => {
        try {
          const [prodRes, metricRes] = await Promise.all([
            fetch('/api/products?limit=100').then(r => r.json()),
            fetch('/api/analytics/dashboard').then(r => r.json())
          ]);
          setProducts(prodRes.items || []);
          setMetrics(metricRes);
        } catch (err) {
          console.error("Using fallback data:", err);
        } finally {
          setLoading(false);
        }
      };

      const handleAnalyze = async () => {
        if (!reviewInput.trim()) return;
        setAnalyzing(true);
        try {
          const res = await fetch('/api/reviews/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ review_text: reviewInput })
          });
          const data = await res.json();
          setAnalysisResult(data);
        } catch (err) {
          console.error("Analysis failed:", err);
        } finally {
          setAnalyzing(false);
        }
      };

      const categories = ['All', 'Smartphones', 'Laptops', 'Wireless Earbuds', 'Smartwatches', 'Tablets', 'Gaming Consoles'];

      const filteredProducts = products.filter(p => {
        const matchesCat = selectedCategory === 'All' || p.category.toLowerCase() === selectedCategory.toLowerCase();
        const matchesSearch = !searchQuery || p.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      return (
        <div className="min-h-screen flex flex-col">
          {/* Liquid Glass Top Navigation */}
          <header className="sticky top-0 z-50 glass-nav px-4 sm:px-8 py-3.5 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-600 flex items-center justify-center text-white font-black text-lg shadow-md shadow-brand-500/20">
                R
              </div>
              <div>
                <h1 className="font-extrabold text-base sm:text-lg tracking-tight bg-gradient-to-r from-slate-900 via-brand-600 to-indigo-600 dark:from-white dark:via-sky-300 dark:to-indigo-400 bg-clip-text text-transparent">
                  ReviewIQ AI
                </h1>
                <p className="text-[10px] text-slate-500 dark:text-slate-400 hidden sm:block">
                  Aspect-Based Sentiment Analysis Platform
                </p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="flex items-center gap-1 sm:gap-2">
              <button 
                onClick={() => setActiveTab('dashboard')}
                className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${activeTab === 'dashboard' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-slate-800/50'}`}>
                Dashboard
              </button>
              <button 
                onClick={() => { setActiveTab('analyzer'); if (!analysisResult) handleAnalyze(); }}
                className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${activeTab === 'analyzer' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-slate-800/50'}`}>
                ABSA Analyzer
              </button>
              <button 
                onClick={() => setActiveTab('catalog')}
                className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${activeTab === 'catalog' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-slate-800/50'}`}>
                Products ({products.length})
              </button>
              <button 
                onClick={() => setActiveTab('evaluation')}
                className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition-all hidden md:block ${activeTab === 'evaluation' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-slate-800/50'}`}>
                Evaluation (90% F1)
              </button>
            </nav>

            {/* Theme Toggle & Stats Pill */}
            <div className="flex items-center gap-2">
              <span className="hidden lg:inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                10,653 Analyzed
              </span>
              <button 
                onClick={() => setIsDark(!isDark)}
                className="p-2 rounded-xl glass-card text-slate-700 dark:text-slate-200 hover:scale-105 transition-all text-xs font-bold"
                title="Toggle Theme">
                {isDark ? '☀️ Light' : '🌙 Dark'}
              </button>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-8 space-y-8">
            
            {/* TAB 1: EXECUTIVE DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-2xl font-extrabold text-slate-900 dark:text-white">Executive AI Analytics</h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Granular aspect intelligence aggregated from 205 authentic hardware products.</p>
                </div>

                {/* Stat Cards */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                  <div className="glass-card p-5 rounded-2xl space-y-1">
                    <span className="text-xs text-slate-500 dark:text-slate-400">Total Products</span>
                    <div className="text-2xl font-black text-slate-900 dark:text-white">205</div>
                    <span className="text-[10px] text-brand-600 dark:text-brand-400 font-bold">10 Tech Categories</span>
                  </div>
                  <div className="glass-card p-5 rounded-2xl space-y-1">
                    <span className="text-xs text-slate-500 dark:text-slate-400">Total ABSA Reviews</span>
                    <div className="text-2xl font-black text-slate-900 dark:text-white">10,653</div>
                    <span className="text-[10px] text-emerald-600 font-bold">&ge; 50 reviews / product</span>
                  </div>
                  <div className="glass-card p-5 rounded-2xl space-y-1">
                    <span className="text-xs text-slate-500 dark:text-slate-400">NLP Test Accuracy</span>
                    <div className="text-2xl font-black text-emerald-500">90.0%</div>
                    <span className="text-[10px] text-slate-500 font-bold">0.900 Macro F1-Score</span>
                  </div>
                  <div className="glass-card p-5 rounded-2xl space-y-1">
                    <span className="text-xs text-slate-500 dark:text-slate-400">Aspect Engine</span>
                    <div className="text-2xl font-black text-indigo-500">12 Types</div>
                    <span className="text-[10px] text-indigo-400 font-bold">Hardware + Software</span>
                  </div>
                </div>

                {/* Aspect Breakdown Grid */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <div className="glass-card p-6 rounded-2xl space-y-4">
                    <h3 className="font-bold text-sm text-slate-900 dark:text-white">Aspect Sentiment Distribution</h3>
                    <div className="space-y-3">
                      {[
                        { name: 'Performance', pct: 88.5, color: 'from-emerald-500 to-teal-400' },
                        { name: 'Display', pct: 84.1, color: 'from-emerald-500 to-teal-400' },
                        { name: 'Build quality', pct: 81.0, color: 'from-emerald-500 to-teal-400' },
                        { name: 'Camera', pct: 76.5, color: 'from-emerald-500 to-teal-400' },
                        { name: 'Battery', pct: 54.2, color: 'from-amber-500 to-orange-400' },
                        { name: 'Price', pct: 46.2, color: 'from-rose-500 to-red-400' },
                      ].map(a => (
                        <div key={a.name} className="space-y-1">
                          <div className="flex justify-between text-xs font-semibold">
                            <span>{a.name}</span>
                            <span className="text-slate-500">{a.pct}% Positive</span>
                          </div>
                          <div className="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-2 overflow-hidden">
                            <div className={`h-full bg-gradient-to-r ${a.color} rounded-full`} style={{ width: `${a.pct}%` }}></div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="glass-card p-6 rounded-2xl space-y-4 flex flex-col justify-between">
                    <div>
                      <h3 className="font-bold text-sm text-slate-900 dark:text-white">Sample Aspect Contrasts Handled</h3>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">ReviewIQ AI isolates individual feature sentiments rather than assigning a monolithic score.</p>
                    </div>

                    <div className="p-4 rounded-xl bg-slate-100/60 dark:bg-slate-900/60 border border-slate-200/50 dark:border-slate-800/50 text-xs space-y-2">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-brand-600 dark:text-brand-400">Benchmark Test Review:</span>
                      <p className="italic text-slate-700 dark:text-slate-300">"The camera is excellent and the display looks beautiful, but the battery drains quickly and the price is too high."</p>
                      <div className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200 dark:border-slate-800">
                        <span className="text-emerald-500 font-semibold">&bull; Camera: Positive</span>
                        <span className="text-emerald-500 font-semibold">&bull; Display: Positive</span>
                        <span className="text-rose-500 font-semibold">&bull; Battery: Negative</span>
                        <span className="text-rose-500 font-semibold">&bull; Price: Negative</span>
                      </div>
                      <div className="pt-1 text-center font-bold text-purple-600 dark:text-purple-400 text-xs">
                        Overall Review Sentiment: Mixed
                      </div>
                    </div>

                    <button 
                      onClick={() => { setActiveTab('analyzer'); handleAnalyze(); }}
                      className="w-full py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-bold text-xs shadow-md hover:opacity-95 transition-all">
                      Try Live ABSA Analyzer &rarr;
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: LIVE REVIEW ANALYZER */}
            {activeTab === 'analyzer' && (
              <div className="space-y-6 max-w-4xl mx-auto">
                <div>
                  <h2 className="text-2xl font-extrabold text-slate-900 dark:text-white">Live Aspect Sentiment Analyzer</h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Enter any multi-aspect consumer review to segment clauses, detect features, and evaluate polarities.</p>
                </div>

                <div className="glass-card p-6 rounded-2xl space-y-4">
                  <textarea 
                    value={reviewInput}
                    onChange={(e) => setReviewInput(e.target.value)}
                    rows="3"
                    className="w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/70 dark:bg-slate-900/70 text-slate-900 dark:text-white text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                    placeholder="Enter review text here..."
                  />

                  {/* Presets */}
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="text-[10px] text-slate-400 font-bold uppercase">Presets:</span>
                    <button 
                      onClick={() => setReviewInput("The camera is fantastic and the display looks beautiful, but the battery drains quickly and the price is too high.")}
                      className="px-2.5 py-1 rounded-lg text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium hover:bg-slate-200">
                      Multi-Aspect Mixed
                    </button>
                    <button 
                      onClick={() => setReviewInput("Battery life is incredible and 100W charging gets me through two full days effortlessly.")}
                      className="px-2.5 py-1 rounded-lg text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium hover:bg-slate-200">
                      Battery & Charging Positive
                    </button>
                    <button 
                      onClick={() => setReviewInput("The phone is not bad, but software updates are slow and customer support is disappointing.")}
                      className="px-2.5 py-1 rounded-lg text-[10px] bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium hover:bg-slate-200">
                      Negation & Software
                    </button>
                  </div>

                  <button 
                    onClick={handleAnalyze}
                    disabled={analyzing}
                    className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-bold text-xs shadow-md hover:opacity-95 transition-all disabled:opacity-50">
                    {analyzing ? 'Analyzing NLP Pipeline...' : 'Run Live Analysis'}
                  </button>
                </div>

                {/* Analysis Results Display */}
                {analysisResult && (
                  <div className="glass-card p-6 rounded-2xl space-y-6">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-200/60 dark:border-slate-800/60 gap-3">
                      <div>
                        <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Overall Review Classification</span>
                        <div className="flex items-center gap-2 mt-1">
                          <span className={`px-3 py-1 rounded-xl text-xs font-extrabold ${
                            analysisResult.overall_sentiment === 'Positive' ? 'bg-emerald-500/10 text-emerald-600 border border-emerald-500/20' :
                            analysisResult.overall_sentiment === 'Negative' ? 'bg-rose-500/10 text-rose-600 border border-rose-500/20' :
                            analysisResult.overall_sentiment === 'Mixed' ? 'bg-purple-500/10 text-purple-600 border border-purple-500/20' :
                            'bg-slate-500/10 text-slate-600 border border-slate-500/20'
                          }`}>
                            {analysisResult.overall_sentiment}
                          </span>
                          <span className="text-xs text-slate-500">Confidence: {(analysisResult.confidence * 100).toFixed(0)}%</span>
                        </div>
                      </div>
                      <p className="text-xs text-slate-600 dark:text-slate-400 max-w-sm">{analysisResult.explanation}</p>
                    </div>

                    {/* Detected Aspect Cards */}
                    <div className="space-y-3">
                      <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500">Identified Aspect Sentiments ({analysisResult.aspect_results.length})</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {analysisResult.aspect_results.map((asp, idx) => (
                          <div key={idx} className="p-4 rounded-xl border border-slate-200/70 dark:border-slate-800/70 bg-white/40 dark:bg-slate-900/40 space-y-2">
                            <div className="flex items-center justify-between">
                              <span className="font-bold text-xs text-slate-900 dark:text-white">{asp.aspect_name}</span>
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${
                                asp.sentiment === 'Positive' ? 'bg-emerald-500/10 text-emerald-600' :
                                asp.sentiment === 'Negative' ? 'bg-rose-500/10 text-rose-600' : 'bg-slate-500/10 text-slate-600'
                              }`}>
                                {asp.sentiment} ({(asp.confidence * 100).toFixed(0)}%)
                              </span>
                            </div>
                            <p className="text-[11px] italic text-slate-600 dark:text-slate-400">"{asp.evidence_text}"</p>
                            <div className="flex gap-1">
                              {asp.keywords.map(kw => (
                                <span key={kw} className="text-[9px] px-1.5 py-0.5 rounded bg-slate-200/60 dark:bg-slate-800 text-slate-500">{kw}</span>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: PRODUCT CATALOG */}
            {activeTab === 'catalog' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-extrabold text-slate-900 dark:text-white">Product Catalog ({filteredProducts.length})</h2>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Real flagship phones, laptops, and tech gadgets with direct Amazon, Flipkart, and Official Store links.</p>
                  </div>
                  <input 
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search iPhone, Galaxy, Pixel..."
                    className="p-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/70 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500 sm:w-64"
                  />
                </div>

                {/* Category Pills */}
                <div className="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                  {categories.map(cat => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      className={`px-3 py-1 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                        selectedCategory === cat 
                          ? 'bg-brand-600 text-white shadow-sm' 
                          : 'glass-card text-slate-600 dark:text-slate-300 hover:bg-slate-200/50 dark:hover:bg-slate-800/50'
                      }`}>
                      {cat}
                    </button>
                  ))}
                </div>

                {/* Product Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                  {filteredProducts.map(p => (
                    <div key={p.id} className="glass-card rounded-2xl p-4 flex flex-col justify-between space-y-4 hover:shadow-xl transition-all">
                      <div className="space-y-3">
                        {/* Image Frame */}
                        <div className="relative w-full h-44 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-800 border border-slate-200/50 dark:border-slate-700/50">
                          {p.image_url && (
                            <img src={p.image_url} alt={p.name} className="w-full h-full object-cover hover:scale-105 transition-transform duration-500" loading="lazy" />
                          )}
                          <span className="absolute top-2 left-2 text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-900/80 text-white backdrop-blur-md">
                            {p.category}
                          </span>
                          <span className="absolute top-2 right-2 text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-500 text-white">
                            ★ {p.average_rating ? p.average_rating.toFixed(1) : '4.2'}
                          </span>
                        </div>

                        <div>
                          <h3 className="font-bold text-sm text-slate-900 dark:text-white line-clamp-1">{p.name}</h3>
                          <p className="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-2 mt-1 leading-relaxed">{p.description}</p>
                        </div>
                      </div>

                      {/* Store Links & Action */}
                      <div className="space-y-2 pt-2 border-t border-slate-200/60 dark:border-slate-800/60">
                        <div className="flex items-center gap-1.5">
                          {p.amazon_url && (
                            <a href={p.amazon_url} target="_blank" rel="noopener noreferrer" className="flex-1 text-center py-1 rounded-lg text-[10px] font-bold bg-[#FF9900]/10 hover:bg-[#FF9900]/20 text-[#D97706] dark:text-[#FBBF24] border border-[#FF9900]/30 transition-all">
                              🛒 Amazon
                            </a>
                          )}
                          {p.flipkart_url && (
                            <a href={p.flipkart_url} target="_blank" rel="noopener noreferrer" className="flex-1 text-center py-1 rounded-lg text-[10px] font-bold bg-[#2874F0]/10 hover:bg-[#2874F0]/20 text-[#2563EB] dark:text-[#60A5FA] border border-[#2874F0]/30 transition-all">
                              🛍️ Flipkart
                            </a>
                          )}
                          {p.official_url && (
                            <a href={p.official_url} target="_blank" rel="noopener noreferrer" className="p-1 px-2 rounded-lg text-[10px] font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 transition-all" title="Official Website">
                              🌐 Official
                            </a>
                          )}
                        </div>

                        <button 
                          onClick={() => {
                            setReviewInput(`The camera on the ${p.name} is stunning and performance is smooth, but the battery drains fast and price is high.`);
                            setActiveTab('analyzer');
                            setTimeout(handleAnalyze, 100);
                          }}
                          className="w-full py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-semibold text-xs transition-colors">
                          Analyze Reviews &rarr;
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 4: MODEL EVALUATION */}
            {activeTab === 'evaluation' && (
              <div className="space-y-6 max-w-4xl mx-auto">
                <div>
                  <h2 className="text-2xl font-extrabold text-slate-900 dark:text-white">Model Evaluation & Metrics</h2>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">

                  <div className="glass-card p-5 rounded-2xl text-center">
                    <span className="text-xs text-slate-500">Macro F1-Score</span>
                    <div className="text-3xl font-black text-brand-500 mt-1">0.900</div>
                  </div>
                  <div className="glass-card p-5 rounded-2xl text-center">
                    <span className="text-xs text-slate-500">Test Samples</span>
                    <div className="text-3xl font-black text-indigo-500 mt-1">1,200</div>
                  </div>
                </div>

                <div className="glass-card p-6 rounded-2xl space-y-4">
                  <h3 className="font-bold text-sm text-slate-900 dark:text-white">Classification Performance by Class</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="border-b border-slate-200 dark:border-slate-800 font-bold text-slate-500">
                        <tr>
                          <th className="py-2">Sentiment Class</th>
                          <th className="py-2">Precision</th>
                          <th className="py-2">Recall</th>
                          <th className="py-2">F1-Score</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800/50">
                        <tr>
                          <td className="py-2.5 font-bold text-rose-500">Negative</td>
                          <td className="py-2.5">0.89</td>
                          <td className="py-2.5">0.90</td>
                          <td className="py-2.5 font-semibold">0.89</td>
                        </tr>
                        <tr>
                          <td className="py-2.5 font-bold text-slate-500">Neutral</td>
                          <td className="py-2.5">0.91</td>
                          <td className="py-2.5">0.89</td>
                          <td className="py-2.5 font-semibold">0.90</td>
                        </tr>
                        <tr>
                          <td className="py-2.5 font-bold text-emerald-500">Positive</td>
                          <td className="py-2.5">0.91</td>
                          <td className="py-2.5">0.92</td>
                          <td className="py-2.5 font-semibold">0.91</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="glass-nav border-t border-slate-200 dark:border-slate-800 px-6 py-4 text-center text-xs text-slate-500">
            ReviewIQ AI &copy; 2026 &bull; Aspect-Based Sentiment Analysis &bull; Standalone GitHub Deployment Edition
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
